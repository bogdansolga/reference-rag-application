# Templates only — DO NOT commit real secrets. Create the real Secrets at deploy:
#
#   PW=$(openssl rand -hex 16)
#   kubectl -n reference-rag create secret generic postgres-secret \
#     --from-literal=POSTGRES_PASSWORD="$PW"
#
#   kubectl -n reference-rag create secret generic rag-secrets \
#     --from-literal=DATABASE_URL="postgresql://rag_admin:$PW@postgres:5432/rag_training" \
#     --from-literal=ANTHROPIC_API_KEY="sk-ant-..."
#
#   # GCP service-account JSON for Vertex embeddings (ADC). Required by BOTH the
#   # web app (query embedding) and the ingestion Job.
#   kubectl -n reference-rag create secret generic gcp-sa \
#     --from-file=sa.json=/path/to/service-account.json
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: reference-rag
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-me
---
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: reference-rag
type: Opaque
stringData:
  DATABASE_URL: postgresql://rag_admin:replace-me@postgres:5432/rag_training
  ANTHROPIC_API_KEY: replace-me
---
apiVersion: v1
kind: Secret
metadata:
  name: gcp-sa
  namespace: reference-rag
type: Opaque
stringData:
  sa.json: |
    { "replace": "with the real service-account JSON" }
